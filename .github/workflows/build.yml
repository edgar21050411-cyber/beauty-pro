name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
      - run: flutter create . --platforms=android --project-name beauty_pro --overwrite
      - run: |
          cat > pubspec.yaml <<'EOF'
          name: beauty_pro
          description: Beauty Pro Final
          publish_to: none
          version: 9.0.0+1
          environment:
            sdk: ">=3.0.0 <4.0.0"
          dependencies:
            flutter:
              sdk: flutter
            http: ^1.1.0
          flutter:
            uses-material-design: true
          EOF
      - run: |
          cat > lib/main.dart <<'DART'
          import 'dart:typed_data';
          import 'package:flutter/material.dart';
          import 'package:http/http.dart' as http;
          void main()=>runApp(const App());
          class App extends StatelessWidget{const App({super.key}); @override Widget build(BuildContext c)=>MaterialApp(debugShowCheckedModeBanner:false, theme: ThemeData(scaffoldBackgroundColor: const Color(0xFFFFF7F9), useMaterial3: true), home: const Home());}
          class Home extends StatefulWidget{const Home({super.key}); @override State<Home> createState()=>_H();}
          class _H extends State<Home>{
            Uint8List? img; bool load=false; String st='';
            final t=TextEditingController(text:'beautiful curvy woman pink dress soft light photorealistic');
            Future<void> gen() async {
              setState(()=>{load=true, st='Generando... 20-30 seg con buen WiFi', img=null});
              try{
                final u=Uri.parse('https://image.pollinations.ai/prompt/${Uri.encodeComponent(t.text)}?width=768&height=1152&nologo=true&model=flux&seed=${DateTime.now().millisecondsSinceEpoch}');
                final r=await http.get(u).timeout(const Duration(seconds:80));
                if(r.statusCode==200 && r.bodyBytes.length>8000){ setState(()=>{img=r.bodyBytes, st='¡Listo! ✨'}); }
                else{ setState(()=>st='Error ${r.statusCode} - intenta de nuevo'); }
              }catch(e){ setState(()=>st='Error red: $e'); }
              setState(()=>load=false);
            }
            @override Widget build(BuildContext c)=>Scaffold(backgroundColor: const Color(0xFFFFF7F9), appBar: AppBar(backgroundColor: const Color(0xFFFFF7F9), elevation:0, centerTitle:true, title: const Text('Beauty Pro', style: TextStyle(fontWeight: FontWeight.w800, color: Color(0xFF4A2C35)))), body: ListView(padding: const EdgeInsets.all(18), children:[
              Container(padding: const EdgeInsets.all(16), decoration: BoxDecoration(color: Colors.white, borderRadius: BorderRadius.circular(20), boxShadow:[BoxShadow(color: Colors.pink.withOpacity(0.06), blurRadius:12)]), child: Column(children:[TextField(controller: t, maxLines:3, decoration: InputDecoration(filled:true, fillColor: const Color(0xFFFFF0F4), hintText: 'Ej: barbie doll, red lingerie, curvy body...', border: OutlineInputBorder(borderRadius: BorderRadius.circular(14), borderSide:BorderSide.none))), const SizedBox(height:10), Wrap(spacing:6, runSpacing:6, children:['barbie doll','curvy hourglass','red lingerie','bikini','fit athletic','tattoo heart','pink silk dress'].map((s)=>ActionChip(label: Text(s, style:const TextStyle(fontSize:11)), backgroundColor: const Color(0xFFFFE4EA), onPressed:()=>setState(()=>t.text=s))).toList())])),
              const SizedBox(height:18),
              SizedBox(height:54, child: ElevatedButton(style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFFFF5A8A), shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(28))), onPressed: load?null:gen, child: load?const SizedBox(width:20,height:20, child:CircularProgressIndicator(color:Colors.white, strokeWidth:2)):const Text('GENERAR ✨', style:TextStyle(color:Colors.white, fontWeight:FontWeight.bold)))),
              const SizedBox(height:10),
              Center(child: Text(st, style: const TextStyle(color: Color(0xFFFF5A8A), fontSize:13))),
              const SizedBox(height:14),
              if(img!=null) ClipRRect(borderRadius: BorderRadius.circular(20), child: Image.memory(img!)),
            ]));
          }
          DART
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Beauty-Pro-V9-VERDE-FUNCIONAL
          path: build/app/outputs/flutter-apk/app-release.apk
